services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      ELEXON_BASE_URL: https://data.elexon.co.uk/bmrs/api/v1
      CORS_ORIGIN: "*"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend
